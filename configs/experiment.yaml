# 统一实验协议。改算法时只应改这里写明的字段，而不是各脚本各写一套。
# 下列默认值对应下一阶段数据语义：26 周历史、next-basket、全量商品、候选并集 500。
# 旧 YAML 缺少新字段时，加载器会填入与本文件一致的默认值。

experiment:
  name: fashionrec_v3
  seed: 2026

data:
  history_weeks: 26
  valid_weeks: 1
  test_weeks: 1
  backtest_windows: 3
  snapshot_frequency: weekly
  max_user_history: 200
  min_user_purchases: 5
  keep_full_item_universe: true
  deduplicate_user_day_item: true

label:
  horizon_days: 7
  target_mode: next_basket
  include_repeat_label: true
  include_new_to_user_label: true

model_selection:
  checkpoint_shortlist_size: 5

candidate:
  per_channel_top_k: 200
  popular_top_k: 200
  category_popular_top_k: 200
  item2item_top_k: 200
  sequence_top_k: 200
  repurchase_top_k: 200
  style_top_k: 200
  content_top_k: 200
  union_top_k: 500  # 默认并集；实验时可改为 1000
  union_feature_version: hm.candidate_union.v2
  final_top_k: 12

ranking:
  enabled: false
  library: lightgbm
  objective: lambdarank
  top_k_for_training: 500

evaluation:
  primary_metric: MAP@12
  protocol: offline_candidate_ranking
  activity_tiers:
    cold_start: [0, 0]
    low: [1, 2]
    medium: [3, 9]
    high: [10, null]
