[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fashionrec-transformer"
version = "0.1.0"
description = "Run-scoped SASRecF and multi-channel fashion recommendation pipeline"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
fashionrec = "fashionrec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
